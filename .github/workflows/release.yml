name: release
# Push a tag like v1.0 to build both DLLs on a clean machine and publish a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Build ffx_tweaks.dll (32-bit)
        shell: cmd
        working-directory: source
        run: |
          cl /nologo /LD /O2 /MT /W3 ffx_tweaks.c /Fe:ffx_tweaks.dll || exit /b 1
          dumpbin /headers ffx_tweaks.dll | findstr /c:"14C machine (x86)" || (echo NOT x86 & exit /b 1)
      - name: Build ffx_item_stock.dll (32-bit)
        shell: cmd
        working-directory: standalone-item-stock-limit
        run: |
          cl /nologo /LD /O2 /MT /W3 ffx_item_stock.c /Fe:ffx_item_stock.dll || exit /b 1
          dumpbin /headers ffx_item_stock.dll | findstr /c:"14C machine (x86)" || (echo NOT x86 & exit /b 1)
      - name: Package
        shell: pwsh
        run: |
          $name = "FFX-Tweaks-Module-${{ github.ref_name }}"
          New-Item -ItemType Directory -Force "pkg/modules", "pkg/standalone-item-stock-limit" | Out-Null
          Copy-Item source/ffx_tweaks.dll, modules/ffx_tweaks.ini "pkg/modules/"
          Copy-Item standalone-item-stock-limit/ffx_item_stock.dll, standalone-item-stock-limit/README.txt "pkg/standalone-item-stock-limit/"
          Copy-Item README.md pkg/
          Compress-Archive -Path pkg/* -DestinationPath "$name.zip"
          "ZIP=$name.zip" >> $env:GITHUB_ENV
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.ZIP }}
          body: |
            FFX Tweaks Collection: Module Edition ${{ github.ref_name }}, built by GitHub Actions from this tag.
            Based on NikoKV's FFX Tweaks Collection, published with his permission:
            https://www.nexusmods.com/finalfantasyxx2hdremaster/mods/186
            Install: copy the contents of `modules` into `<game folder>\modules\` (ffgriever's FF10 Module Loader).
