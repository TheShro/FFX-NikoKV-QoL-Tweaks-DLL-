name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Build ffx_tweaks.dll (32-bit)
        shell: cmd
        working-directory: source
        run: cl /nologo /LD /O2 /MT /W3 ffx_tweaks.c /Fe:ffx_tweaks.dll
      - name: Build ffx_item_stock.dll (32-bit)
        shell: cmd
        working-directory: standalone-item-stock-limit
        run: cl /nologo /LD /O2 /MT /W3 ffx_item_stock.c /Fe:ffx_item_stock.dll
      - uses: actions/upload-artifact@v4
        with:
          name: ffx-tweaks-module
          path: |
            source/ffx_tweaks.dll
            modules/ffx_tweaks.ini
            standalone-item-stock-limit/ffx_item_stock.dll
