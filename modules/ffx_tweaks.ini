; FFX Tweaks module - set a value to 0 to turn that tweak off, then restart the game.
; Original tweaks by NikoKV. Hook port by Shro (with Claude, Anthropic).
[Tweaks]
ItemStockLimit=1
LightningDodger=1
ShorterLeague=1
BlitzballLevels=1
BlitzballAutoLearn=1
ChocoboCatcher=1
; Chocobo Catcher starting score preset (TID.balls / TRA.balls / TID.birds / TRA.birds):
;   1 = 3/0/0/0 (default)    2 = 4/0/0/0    3 = 30/0/0/30
ChocoboCatcherPreset=1
